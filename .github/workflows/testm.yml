name: Basic CI building

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs: 
  builder:
    runs-on: ubuntu-latest
    steps:
      - name: code cloning
        uses: actions/checkout@v3
      - name: create .env file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{secrets.POSTGRES_DB}}
          POSTGRES_USER=${{secrets.POSTGRES_USER}}
          passwordsess=${{ secrets.PASSWORDSESS }}
          passwordstaff=${{secrets.PASSWORDSTAFF}}
          passwordusers=${{secrets.PASSWORDUSERS}}
          passworddb=${{secrets.PASSWORDDB}}
          testuser=${{secrets.TESTUSER}}
          testpassword=${{secrets.TESTPASSWORD}}
          EOF
      - name: build with docker
        run: |
          docker compose up -d 
      - name: show container status if failed
        if: failure()
        run: |
          docker compose ps
          docker compose logs
      - name: test images
        if: success()
        run: docker exec backend_container npm test
