name: Basic CI building

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs: 
  builder:
    runs-on: ubuntu-latest
    steps:
      - name: code cloning
        uses: actions/checkout@v3
      - name: create .env file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{secrets.POSTGRES_DB}}
          POSTGRES_USER=${{secrets.POSTGRES_USER}}
          passwordsess=${{ secrets.PASSWORDSESS }}
          passwordstaff=${{secrets.PASSWORDSTAFF}}
          passwordusers=${{secrets.PASSWORDUSERS}}
          passworddb=${{secrets.PASSWORDDB}}
          testuser=${{secrets.TESTUSER}}
          testpassword=${{secrets.TESTPASSWORD}}
          envdatabase=postgres
          envuser=${{secrets.ENVUSER}}
          envpassword=${{secrets.ENVPASSWORD}}
          envhost=${{secrets.ENVHOST}}
          envport=${{secrets.ENVPORT}}
          EOF
      - name: build with docker
        run: |
          docker compose up -d 
      - name: show container status if failed
        if: failure()
        run: |
          docker compose ps
          docker compose logs
      - name: test images
        if: success()
        run: docker exec backend_container npm test
      - name: login docker
        uses: docker/login-action@v3
        with:
          username: ${{secrets.USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}
      - name: docker push
        run: |
          VERSION=$(date "+%Y-%m-%d_%H-%M-%S")
          docker build -t ${{secrets.USERNAME}}/backend_stable:${VERSION} ./backend
          docker build -t ${{secrets.USERNAME}}/redis_stable:${VERSION} ./redis
          docker build -t ${{secrets.USERNAME}}/frontend_stable:${VERSION} ./frontend
          docker build -t ${{secrets.USERNAME}}/db_stable:${VERSION} ./db
          docker push ${{secrets.USERNAME}}/db_stable:${VERSION}
          docker push ${{secrets.USERNAME}}/redis_stable:${VERSION}
          docker push ${{secrets.USERNAME}}/backend_stable:${VERSION}
          docker push ${{secrets.USERNAME}}/frontend_stable:${VERSION}
          
        
        
