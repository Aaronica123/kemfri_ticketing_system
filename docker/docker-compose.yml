version : '3.8'
services: 
    backend_container:
        build:
          context: ./backend
          dockerfile: Dockerfile
        # image: backend_image:latest
        container_name: backend_container
        ports:
        - "3001:3001"
        env_file:
          - .env
        networks:
          - kemfri_network
        restart: always
        depends_on:
          redis_container:
           condition: service_healthy
          dbcache:
            condition: service_healthy
        

    redis_container:
      build:
        context: ./redis
        dockerfile: Dockerfile
      # image: redis_image:latest
      container_name: redis_container
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 30s
        retries: 3
        start_period: 10s
      networks:
        - kemfri_network
      restart: always
      ports:
        - "6379:6379"
      
    frontend_container:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      # image: frontend_image:latest
      container_name: frontend_container
      healthcheck:
        test: ["CMD", "curl", "-f", "http://frontend_container:80"]
        timeout: 10s
        interval: 10s
        retries: 5
        start_period: 160s
      networks: 
        - kemfri_network 
      ports:
        - "80:80"
      depends_on:
         backend_container:
           condition: service_started
    dbcache:
      build:
         context: ./redis
         dockerfile: Dockerfile
      ports:
         - "5555:6379"
      networks:
        - kemfri_network
      restart: always 
      container_name: dbcache
      healthcheck:
        test: ["CMD","redis-cli","ping"]
        interval: 3s
        start_period: 1s
        retries: 3
        timeout: 10s
volumes:
  db_driver:

networks:
  kemfri_network:
    driver: bridge

