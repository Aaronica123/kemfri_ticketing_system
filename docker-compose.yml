services:
  minio_container:
    image: aaronica123/minio:latest
    expose:
      - "9000"
    ports:
      - "9000:9000"
    environment:
      - MINIO_ROOT_PASSWORD=""
      - MINIO_ROOT_USER=""
    container_name: minio_container
  
  rabbit_container:
    image: aaronica123/rabbit:latest
    expose:
      - "5672"
    ports:
      - "5672:5672"
    container_name: rabbit_container
  
    