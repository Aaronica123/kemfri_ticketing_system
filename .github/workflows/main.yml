name: Basic CI building

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs: 
  builder:
    runs-on: ubuntu-latest
    steps:
      - name: code cloning
        uses: actions/checkout@v3
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install docker-compose -y
          docker-compose --version  # Verify installation
      - name: create .env file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{secrets.POSTGRES_DB}}
          POSTGRES_USER=${{secrets.POSTGRES_USER}}
          passwordsess=${{ secrets.PASSWORDSESS }}
          passwordstaff=${{secrets.PASSWORDSTAFF}}
          passwordusers=${{secrets.PASSWORDUSERS}}
          passworddb=${{secrets.PASSWORDDB}}
          testuser=${{secrets.TESTUSER}}
          testpassword=${{secrets.TESTPASSWORD}}
          EOF
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: aaronica123
      #     password: ${{secrets.DOCKER_TOKEN}}
      # - name: docker pull
      #   run: |
      #     docker pull aaronica123/db_stable:1.0
      # docker-compose build
      - name: build with docker
        run: |
          docker-compose up -d
          
         
      - name: test images
        if: success()
        run: docker exec backend_container npm run test
