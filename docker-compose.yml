services:
  backend_container:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
       - endPoint=${endPoint}
       - port=${port}
       - accessKey=${accessKey}
       - secretKey=${secretKey}
       - path=${path}
       - frontendurl=${frontendurl}
       - api_key=${api_key}
       - url=${url}
    expose:
      - "3001"
    ports:
      - "3001:3001"
    container_name: backend_container
    networks:
      - kemfrinetwork
    env_file:
      - -.env

  minio-container:
    build: 
      context: .
      dockerfile: Dockerfile
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.minio
    container_name: minio-container
    networks:
      - kemfrinetwork
  
  rabbit_container:
    image: aaronica123/rabbit:latest
    expose:
      - "5672"
    ports:
      - "5672:5672"
    container_name: rabbit_container
    networks:
      - kemfrinetwork
  redis_container:
    image: aaronica123/redis_stable:2026-08-24_09-49-24
    expose:
      - "6379"
    ports:
      - "6379:6379"
    container_name: redis_container
    networks:
      - kemfrinetwork
  flask_container:
    build:
      context: ./flask_app
      dockerfile: Dockerfile
    expose:
      - "5000"
    ports:
      - "5000:5000"
    networks:
      - kemfrinetwork
    container_name: flask_container
  nginx_container:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_API_KEY=${VITE_API_KEY}
        - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    ports:
      - "80:80"
    expose:
      - "80"
    container_name: nginx_container
    depends_on:
      - flask_container
      - backend_container
    networks:
      - kemfrinetwork
    

networks:
  kemfrinetwork:
    driver: bridge
  
    