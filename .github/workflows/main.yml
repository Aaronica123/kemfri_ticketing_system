name: Basic CI building

on:
  push:
    branches: ['main','tracker']
  pull_request:
    branches: ['main','tracker']

jobs: 
  builder:
    runs-on: ubuntu-latest
    steps:
      - name: code cloning
        uses: actions/checkout@v3
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install docker-compose -y
          docker-compose --version  # Verify installation
      - name: create .env file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          passwordsess=${{ secrets.PASSWORDSESS }}
          passwordstaff=${{secrets.PASSWORDSTAFF}}
          passwordusers=${{secrets.PASSWORDUSERS}}
          passworddb=${{secrets.PASSWORDDB}}
          testuser=${{secrets.TESTUSER}}
          testpassword=${{secrets.TESTPASSWORD}}
          EOF
      - name: build with docker
        run: |
          docker-compose build
          docker-compose up -d
      - name: test images
        run: docker run --network kemfri_ticketing_system_kemfri_network --env-file .env --rm backend_image:latest npm run test
      - name: start docker containers
        if: success()
        run: |
          # docker-compose up -d
          docker-compose down -v 
