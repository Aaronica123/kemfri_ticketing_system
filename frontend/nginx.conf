http{
    server{
    listen 80;
    include /etc/nginx/mime.types;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/ttf
        font/otf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
#     location ^~ /assets/ {
#     add_header Cache-Control "public, max-age=31536000, immutable";
#     try_files $uri =404;
# }
    location /api/{
        proxy_pass http://backend_container:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /ai/{
        proxy_pass http://flask_container:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /_next/webpack-hmr {
    proxy_pass http://localhost:8018/_next/webpack-hmr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
} 
}
events{}