name: Docker Build And Push Images

on:
  pull_request:
    branches:
      - main
    types: labeled
  workflow_dispatch:
    inputs:
      build: 
        type: string
        
permissions: write-all
env:
  VITE_API_URL: ${{secrets.VITE_API_URL}}
  VITE_API_KEY: ${{secrets.VITE_API_KEY}}
jobs:
  docker:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name,'merge') || (github.event_name=='workflow_dispatch' && inputs.build=='build' )
    steps:
      
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_tOKEN}}
        name: Set up QEMU
      - uses: docker/setup-qemu-action@v4
      
        name: Set up Docker Buildx
      - uses: docker/setup-buildx-action@v4
        
          
            
      
        name: Build and push
      - uses: docker/build-push-action@v7
        with:
          file: backend/Dockerfile
          context: backend
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/km_backend:latest
          build-args: |
            url=${{secrets.URL_BACKEND}}
            api_key=${{secrets.API_KEY_BACKEND}}
            endPoint=${{secrets.ENDPOINT}}
            port=${{secrets.PORT}}
            accessKey=${{secrets.ACCESSKEY}}
            secretKey=${{secrets.SECRETKEY}}
            frontendurl=${{secrets.FRONTENDURL_BACKEND}}
            redisurl=${{secrets.REDISURL_BACKEND}}
            rabbitmq=${{secrets.RABBITMQ}}
       
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: frontend/Dockerfile
          context: frontend
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/km_frontend:latest
          build-args: |
            VITE_API_URL=${{secrets.VITE_API_URL}}
            VITE_API_KEY=${{secrets.VITE_API_KEY}}
      
