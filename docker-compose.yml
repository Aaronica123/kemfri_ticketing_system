services:
  minio_container:
    image: aaronica123/minio:latest
    expose:
      - "9000"
    ports:
      - "9000:9000"
    env_file:
      - .env
    container_name: minio_container
    networks:
      - kemfrinetwork
  
  rabbit_container:
    image: aaronica123/rabbit:latest
    expose:
      - "5672"
    ports:
      - "5672:5672"
    container_name: rabbit_container
    networks:
      - kemfrinetwork
  redis_container:
    image: aaronica123/redis_stable:2026-08-24_09-49-24
    expose:
      - "6379"
    ports:
      - "6379:6379"
    container_name: redis_container
    networks:
      - kemfrinetwork
  flask_container:
    build:
      context: ./flask_app
      dockerfile: Dockerfile
    expose:
      - "5000"
    ports:
      - "5000:5000"
    networks:
      - kemfrinetwork
    container_name: flask_container
networks:
  kemfrinetwork:
    driver: bridge
  
    